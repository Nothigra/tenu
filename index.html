<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B3FE4">
<meta name="description" content="Tenu : ton dressing, ton style, tes tenues. Essayage IA, tenue du jour et dressing partagé.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tenu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F3EFFA; --surface:#FFFFFF; --surface2:#F6F2FC; --line:#E6DFF2;
  --text:#15111E; --muted:#6B6280; --mauve:#7B3FE4; --mauve-2:#9A6BF2; --mauve-soft:#EEE5FF;
  --lime:#C6F432; --lime-ink:#4A6600; --lime-soft:#F1FCCB; --on-lime:#15111E; --on-mauve:#FFFFFF;
  --mannequin:#DCD5E8; --stage1:#F4EEFF; --stage2:#E9F8C2; --shadow:0 10px 30px rgba(60,30,120,.10);
  --danger:#C23A5A; --good:#2F8A4E;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A090D; --bg2:#050407; --surface:#15121C; --surface2:#1B1724; --line:#2A2436;
    --text:#F3EFFB; --muted:#9C94AF; --mauve:#A67CFF; --mauve-2:#8456F0; --mauve-soft:#261C3B;
    --lime:#C6F432; --lime-ink:#C6F432; --lime-soft:#222B0E; --on-lime:#0A090D; --on-mauve:#0A090D;
    --mannequin:#3A3349; --stage1:#1A1428; --stage2:#141A0A; --shadow:0 10px 30px rgba(0,0,0,.45);
    --danger:#FF6B8B; --good:#7BE08F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A090D; --bg2:#050407; --surface:#15121C; --surface2:#1B1724; --line:#2A2436;
  --text:#F3EFFB; --muted:#9C94AF; --mauve:#A67CFF; --mauve-2:#8456F0; --mauve-soft:#261C3B;
  --lime:#C6F432; --lime-ink:#C6F432; --lime-soft:#222B0E; --on-lime:#0A090D; --on-mauve:#0A090D;
  --mannequin:#3A3349; --stage1:#1A1428; --stage2:#141A0A; --shadow:0 10px 30px rgba(0,0,0,.45);
  --danger:#FF6B8B; --good:#7BE08F; color-scheme:dark;
}
html,body{height:100%}
html,body{overflow-x:clip}
body{background:var(--bg2);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--mauve);outline-offset:2px;border-radius:10px}
.app{max-width:440px;margin:0 auto;min-height:100%;overflow-x:clip;background:var(--bg);position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg);}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.logo i{font-style:normal;color:var(--lime-ink)}
.logo small{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.screen{padding-inline:16px;display:flex;flex-direction:column;gap:18px;padding-block:4px 20px}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:15px;margin:0;letter-spacing:-.01em}
h3{margin:0}
.lede{color:var(--muted);margin:6px 0 0;font-size:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step{display:flex;flex-direction:column;gap:10px}
.step-h{display:flex;align-items:center;gap:8px}
.num{width:22px;height:22px;border-radius:8px;background:var(--mauve);color:var(--on-mauve);font-family:var(--display);font-size:11px;display:grid;place-items:center;flex:none}
.row{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--lime);color:var(--on-lime);border-color:transparent;height:52px;font-size:15px;width:100%;border-radius:16px}
.btn.mauve{background:var(--mauve);color:var(--on-mauve);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.btn.xs{height:30px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.98)}
.photo-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.thumb{width:56px;height:72px;border-radius:12px;overflow:hidden;background:var(--stage1);flex:none;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{height:92%}
.photo-row .meta{flex:1;min-width:0}
.photo-row .meta b{display:block;font-size:14px}
.photo-row .meta span{font-size:12px;color:var(--muted)}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted)}
.privacy svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--lime-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--mauve);color:var(--on-mauve);border-color:var(--mauve)}
.chip.sm{height:32px;padding:0 12px;font-size:12px}
.chip svg{width:16px;height:16px}
.sw{display:inline-flex}
.sw i{width:12px;height:12px;border-radius:50%;margin-left:-4px;border:1.5px solid var(--surface)}
.sw i:first-child{margin-left:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.switch b{font-size:14px;display:block}
.switch span{font-size:12px;color:var(--muted)}
.tog{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-checked="true"]{background:var(--mauve)}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.stage{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:24px;overflow:hidden;background:radial-gradient(120% 80% at 50% 10%,var(--stage1),var(--bg) 70%);border:1px solid var(--line);--cut:32%;user-select:none}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.layer.after{clip-path:inset(0 0 0 var(--cut));background:radial-gradient(120% 80% at 50% 12%,var(--mauve-soft),var(--stage2) 95%)}
.layer.pins{z-index:7;pointer-events:none;clip-path:inset(0 0 0 var(--cut))}
.fig{position:relative;height:92%;aspect-ratio:200/440;max-width:100%}
.fig svg{width:100%;height:100%;display:block}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.7}
.cutline{transition:opacity .2s;position:absolute;top:0;bottom:0;left:var(--cut);width:2px;background:var(--lime);transform:translateX(-1px);pointer-events:none;z-index:3}
.cutline::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;border-radius:50%;background:var(--lime);transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.stage{touch-action:pan-y;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage.anim .layer.after,.stage.anim .layer.pins{transition:clip-path .35s ease}
.stage.anim .cutline{transition:left .35s ease}
.tag-l,.tag-r{transition:opacity .2s}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;gap:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.cmp button{height:36px;border-radius:10px;font-weight:700;font-size:13px}
.cmp button[aria-pressed="true"]{background:var(--mauve);color:var(--on-mauve)}
.tag-l,.tag-r{position:absolute;top:12px;z-index:8;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;pointer-events:none}
.tag-l{left:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--text)}
.tag-r{right:12px;background:var(--mauve);color:var(--on-mauve)}
.pin{position:absolute;pointer-events:auto;cursor:pointer;width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-family:var(--display);font-size:11px;display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 30%,transparent),0 2px 8px rgba(0,0,0,.3);border:0;transition:transform .15s}
.pin:hover,.pin:active{transform:translate(-50%,-50%) scale(1.12)}
.demo-note{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;font-size:11px;line-height:1.35;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);color:var(--muted);pointer-events:none}
.loading{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--bg) 90%,transparent);}
.loading b{font-family:var(--display);font-size:14px;font-weight:500}
.bar{width:60%;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mauve),var(--lime));animation:fill 1.7s ease-out forwards}
@keyframes fill{to{width:100%}}
.scan{position:absolute;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--lime) 25%,transparent),transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{top:-40%}to{top:100%}}
.look-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sub{font-size:12px;color:var(--muted)}
.price{font-family:var(--display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{padding:0 8px;font-size:13px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.flash{animation:flash 1s ease}
@keyframes flash{0%,40%{background:var(--lime-soft)}100%{background:transparent}}
.n{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-family:var(--display);font-size:10px;display:grid;place-items:center;flex:none}
.ico{width:48px;height:48px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;overflow:hidden}
.ico svg{width:80%;height:80%}
.ico img{width:100%;height:100%;object-fit:contain}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.item .right .p{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--mauve);text-decoration:none;padding:4px 8px;border-radius:8px;background:var(--mauve-soft)}
.link svg{width:12px;height:12px}
.own{font-size:11px;font-weight:800;color:var(--lime-ink);background:var(--lime-soft);padding:4px 8px;border-radius:8px;letter-spacing:.02em;white-space:nowrap}
.friend-own{font-size:11px;font-weight:800;color:var(--mauve);background:var(--mauve-soft);padding:4px 8px;border-radius:8px;white-space:nowrap}
.warn{font-size:11px;font-weight:800;color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);padding:4px 8px;border-radius:8px;white-space:nowrap}
.aff{font-size:11px;color:var(--muted);margin:-8px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left}
.tile .box{aspect-ratio:1;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.tile .box svg{width:70%;height:70%}
.tile .box img{width:100%;height:100%;object-fit:contain}
.tile span{min-height:2.5em;font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile.add .box{border-style:dashed;border-color:var(--mauve);background:var(--mauve-soft);color:var(--mauve)}
.tile.add .box svg{width:32%;height:32%}
.tile .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface)}
.tile .zz{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--mauve-soft);color:var(--mauve)}
.card{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:14px}
.card.tinted{background:var(--mauve-soft);border-color:transparent}
.outfit{display:flex;gap:12px;align-items:stretch}
.mini{width:78px;flex:none;border-radius:14px;background:radial-gradient(120% 80% at 50% 10%,var(--mauve-soft),var(--surface2));display:grid;place-items:center;padding:6px 0}
.mini svg{height:150px;width:auto}
.outfit .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.outfit .body > b{font-family:var(--display);font-weight:500;font-size:14px}
.pieces{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pieces span{display:flex;align-items:center;gap:6px}
.pieces i{width:9px;height:9px;border-radius:3px;flex:none}
.btns{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.slider-wrap{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.slider-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted)}
input[type=range].rng{width:100%;accent-color:var(--mauve);height:28px}
.ratio{font-family:var(--display);font-size:13px;text-align:center}
.friend{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);width:100%;text-align:left}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:14px;flex:none;color:#0A090D}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:11px}
.friend .info{flex:1;min-width:0}
.friend .info b{display:block;font-size:15px}
.friend .info span{font-size:12px;color:var(--muted)}
.access{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.access svg{width:12px;height:12px}
.access.full{background:var(--lime-soft);color:var(--lime-ink)}
.access.match{background:var(--mauve-soft);color:var(--mauve)}
.access.none{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.add-row{display:flex;gap:8px}
.field{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:14px}
.field:focus{outline:2px solid var(--mauve);outline-offset:0}
.seg{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--mauve);background:var(--mauve-soft)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--mauve)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--mauve)}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.segbar{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);gap:4px}
.segbar button{height:38px;border-radius:10px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.segbar button[aria-pressed="true"]{background:var(--mauve);color:var(--on-mauve)}
.segbar button svg{width:16px;height:16px}
.result{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--lime-soft);border:1px solid color-mix(in srgb,var(--lime) 50%,var(--line))}
.result h3{font-family:var(--display);font-weight:500;font-size:14px;color:var(--text)}
.result p{margin:0;font-size:13px;color:var(--muted)}
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 16px;border-radius:18px;border:1px dashed var(--line);color:var(--muted)}
.lock svg{width:28px;height:28px;color:var(--mauve)}
.lock b{color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.me{display:flex;gap:14px;align-items:center}
.me .av{width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--mauve),var(--lime));font-size:18px}
.pp{position:relative;width:72px;height:72px;flex:none;cursor:pointer}
.pp .face{width:72px;height:72px;border-radius:24px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--mauve),var(--lime));font-family:var(--display);font-size:22px;color:#0A090D}
.pp .face img{width:100%;height:100%;object-fit:cover}
.pp .cam{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;border:3px solid var(--bg)}
.pp .cam svg{width:14px;height:14px}
.pp input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tabface{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block}
nav.tabs button[aria-current="page"] .tabface{box-shadow:0 0 0 2px var(--on-lime)}
.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.saved-grid button{border-radius:16px;background:radial-gradient(120% 80% at 50% 10%,var(--mauve-soft),var(--surface2));border:1px solid var(--line);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.saved-grid svg{height:110px;width:auto}
.saved-grid span{font-size:11px;font-weight:700}
.empty{padding:18px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center}
/* Aujourd'hui */
.wx{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:linear-gradient(145deg,var(--mauve),var(--mauve-2));color:#fff}
.wx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wx .temp{font-family:var(--display);font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wx .cond{font-weight:700;font-size:14px}
.wx .date{font-size:12px;opacity:.8;text-transform:capitalize}
.wx svg.big{width:48px;height:48px}
.wx .chips{margin-inline:0;padding-inline:0}
.wx .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.wx .chip[aria-pressed="true"]{background:var(--lime);color:#15111E;border-color:var(--lime)}
.wx .demo{font-size:11px;opacity:.75}
.agenda{display:flex;flex-direction:column;gap:6px}
.ag{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.ag[aria-pressed="true"]{border-color:var(--mauve);background:var(--mauve-soft)}
.ag time{font-family:var(--display);font-size:12px;font-variant-numeric:tabular-nums;width:44px;flex:none}
.ag b{font-size:14px;flex:1}
.ag span{font-size:11px;font-weight:800;color:var(--mauve)}
.ootd{display:flex;gap:14px;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--surface)}
.ootd .mini{width:120px}
.ootd .mini svg{height:230px}
.reasons{display:flex;flex-direction:column;gap:6px;font-size:12px}
.reasons span{display:flex;gap:6px;align-items:flex-start}
.reasons svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--mauve)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.day.today{border-color:var(--lime);background:var(--lime-soft)}
.day small{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.day b{font-size:12px;font-variant-numeric:tabular-nums}
.day .dmini{height:62px;display:grid;place-items:center}
.day .dmini svg{height:62px;width:auto}
.day .none{width:18px;height:2px;background:var(--line);border-radius:2px;margin:30px 0}
/* Impact, sondages, prêts */
.impact{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.impact:first-child{border-top:0}
.gain{font-family:var(--display);font-size:15px;color:var(--lime-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.poll{display:flex;flex-direction:column;gap:10px}
.poll-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.popt{border-radius:16px;border:1px solid var(--line);background:var(--surface2);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.popt.lead{border-color:var(--lime)}
.popt svg{height:120px;width:auto}
.popt .pb{width:100%;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.popt .pb i{display:block;height:100%;background:var(--mauve);transition:width .4s}
.popt .pl{font-size:12px;font-weight:700;display:flex;justify-content:space-between;width:100%;font-variant-numeric:tabular-nums}
.status{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;white-space:nowrap}
.status.pending{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.status.ok{background:var(--lime-soft);color:var(--lime-ink)}
.status.no{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:16px;background:radial-gradient(120% 80% at 50% 10%,var(--mauve-soft),var(--surface2));border:1px solid var(--line)}
.gcard svg{height:130px;width:auto}
.gcard b{font-size:12px}
.gcard span{font-size:11px;color:var(--muted)}
.budget{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.bopt b{font-family:var(--display);font-size:15px;font-weight:500;color:var(--lime-ink);letter-spacing:.02em}
.bopt span{font-size:12px;font-weight:700}
.bopt[aria-checked="true"]{border-color:var(--mauve);background:var(--mauve-soft)}
.exact{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.exact.on{border-color:var(--mauve);background:var(--mauve-soft)}
.exact label{font-size:12px;font-weight:700;color:var(--muted)}
.exact-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.money{display:flex;align-items:center;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;flex:1;min-width:110px}
.money input{border:0;background:transparent;width:100%;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.money span{font-family:var(--display);color:var(--muted)}
.money:focus-within{outline:2px solid var(--mauve)}
.tier{font-family:var(--display);font-size:10px;color:var(--muted);letter-spacing:.04em}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizes label{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sizes .field{flex:none;width:100%;min-width:0;height:40px;padding:0 10px;text-transform:none;font-weight:600;letter-spacing:0;color:var(--text)}
.drop{color:var(--good);font-weight:800;font-size:12px}
.strike{text-decoration:line-through;color:var(--muted);font-size:12px}
.detect{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--lime-soft);font-size:12px;font-weight:700;color:var(--lime-ink)}
.detect svg{width:16px;height:16px;flex:none}
.checker{background-color:var(--surface2);background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%),linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.order{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.order-h{display:flex;justify-content:space-between;padding:8px 12px;background:var(--surface2);font-size:12px;font-weight:700}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check[aria-checked="true"]{background:var(--mauve);border-color:var(--mauve);color:var(--on-mauve)}
.check svg{width:14px;height:14px}
input[type=date].field{height:44px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:440px;will-change:auto;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
nav.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] .ti{background:var(--mauve-soft);color:var(--mauve)}
nav.tabs .ti{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .2s}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 10px);min-width:16px;height:16px;border-radius:8px;background:var(--mauve);color:var(--on-mauve);font-size:10px;display:grid;place-items:center;padding:0 4px}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(5,3,10,.55);animation:fadeIn .25s ease both}
.sheet{position:relative;width:100%;max-width:440px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sheetUp .42s cubic-bezier(.2,.9,.25,1.05) both}
.sheet-wrap.closing .backdrop{animation:fadeOut .22s ease both}
.sheet-wrap.closing .sheet{animation:sheetDown .22s ease-in both}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid var(--line)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--mauve);outline-offset:2px}
.preview-img{width:100%;height:220px;object-fit:contain;border-radius:16px}
.toast.in{animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2) both}
.toast.out{animation:toastOut .22s ease both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);font-weight:700;font-size:13px;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.label-file{cursor:pointer}
.label-file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:0}


/* ---------- Écrans simplifiés ---------- */
.center{align-self:center;text-align:center}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbar{display:flex;flex-direction:column;gap:10px}
.tdate{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tdate::first-letter{text-transform:uppercase}
.tpills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{width:16px;height:16px;color:var(--mauve);flex:none}
.pill .temp{font-family:var(--display);font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px 18px;border-radius:28px;background:radial-gradient(120% 70% at 50% 0%,var(--mauve-soft),var(--surface2) 75%);border:1px solid var(--line);text-align:center}
.hero .hero-fig{width:auto;background:none;padding:0}
.hero .hero-fig svg{height:min(300px,40vh);width:auto}
.hero-meta{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.hero-title{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.reason{display:flex;gap:6px;align-items:flex-start;justify-content:center;margin:0;font-size:13px;color:var(--muted);max-width:36ch}
.reason svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--mauve)}
.piece-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:4px}
.piece-chips span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.piece-chips i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:none}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.menu-row{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);text-align:left;font-weight:700;font-size:14px;width:100%}
.menu-row:first-child{border-top:0}
.menu-row span:last-child{display:flex;flex-direction:column}
.menu-row small{font-size:12px;font-weight:500;color:var(--muted)}
.mi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--mauve-soft);color:var(--mauve);flex:none}
.mi svg{width:18px;height:18px}
@media (hover:hover){.menu-row:hover{background:var(--surface2)}}
.filterbar{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fpill{flex:none;display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.fpill svg{width:14px;height:14px;opacity:.6}
.fpill.ph{width:40px;padding:0;overflow:hidden;justify-content:center;background:var(--stage1)}
.fpill.ph img{width:100%;height:100%;object-fit:cover}
.fpill .mf svg{height:34px;width:auto;opacity:1}
.fpill.on{background:var(--mauve);border-color:var(--mauve);color:var(--on-mauve)}
.fpill.on svg{opacity:1}
.empty-stage{display:flex;align-items:center;justify-content:center}
.summary{display:flex;gap:8px;align-items:center}
.sum-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.sum-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sum-t b{font-size:14px}
.sum-t span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{display:grid;place-items:center;color:var(--muted);transition:transform .25s ease}
.chev svg{width:18px;height:18px}
.chev.up{transform:rotate(180deg)}
.act .chev{transform:rotate(-90deg)}
.style-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.style-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 10px;border-radius:16px;border:1.5px solid var(--line);background:radial-gradient(120% 80% at 50% 10%,var(--mauve-soft),var(--surface2))}
.style-card[aria-pressed="true"]{border-color:var(--mauve)}
.style-card .sc-fig svg{height:110px;width:auto}
.style-card b{font-size:12px}
.fab{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--lime);color:var(--on-lime);flex:none;box-shadow:0 8px 20px color-mix(in srgb,var(--lime) 30%,transparent);transition:transform .15s ease}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.94)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tabs3 button{height:36px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:background-color .25s ease,color .25s ease}
.tabs3 button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.act{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.act:first-child{border-top:0}
.act .info{flex:1;min-width:0}
.act .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .info span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico.sm{width:36px;height:36px;border-radius:10px;color:var(--mauve)}
.ico.sm svg{width:70%;height:70%}
.warn-btn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.groups{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:14px}
.grp summary::-webkit-details-marker{display:none}
.grp summary > svg:first-child{width:18px;height:18px;color:var(--mauve)}
.grp summary span{flex:1}
.grp summary em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.grp summary > svg:last-child{width:16px;height:16px;color:var(--muted);transition:transform .25s ease}
.grp[open] summary > svg:last-child{transform:rotate(180deg)}
.grp-body{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;animation:rise .3s ease both}
.poll{display:flex;flex-direction:column;gap:12px}
.search-ov{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 78%,transparent);animation:fadeIn .3s ease both}
.search-btn{display:flex;align-items:center;gap:12px;padding:16px 22px;border-radius:22px;background:var(--lime);color:var(--on-lime);box-shadow:0 14px 34px color-mix(in srgb,var(--lime) 40%,transparent);text-align:left;transition:transform .15s ease;animation:rise .4s .05s both}
.search-btn:active{transform:scale(.97)}
.search-btn svg{width:26px;height:26px;flex:none}
.search-btn span{display:flex;flex-direction:column}
.search-btn b{font-family:var(--display);font-size:17px;font-weight:700}
.search-btn small{font-size:12px;font-weight:700;opacity:.7}
.swipe-row.dim{opacity:.4;pointer-events:none}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.langs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;transition:background-color .25s ease,border-color .25s ease}
.langs button b{font-family:var(--display);font-size:14px;font-weight:500;color:var(--mauve)}
.langs button span{font-size:12px;font-weight:700}
.langs button[aria-checked="true"]{border-color:var(--mauve);background:var(--mauve-soft)}
/* ---------- Écran d'accueil ---------- */
.intro{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:100;background:var(--bg);color:var(--text);overflow:hidden;display:flex;justify-content:center;
  clip-path:circle(150% at 50% 82%);transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
.intro.leaving{clip-path:circle(0% at 50% 82%)}
.intro-theme{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:3;background:color-mix(in srgb,var(--surface) 80%,transparent);animation:fadeIn .6s .2s both}
.intro-in{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.blob{position:absolute;border-radius:50%;opacity:.55;pointer-events:none;will-change:transform}
.blob.a{width:520px;height:520px;background:radial-gradient(closest-side,var(--mauve),transparent);top:-170px;left:-210px;animation:drift 9s ease-in-out infinite alternate}
.blob.b{width:440px;height:440px;background:radial-gradient(closest-side,var(--lime),transparent);bottom:-20px;right:-200px;opacity:.35;animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
.intro-top{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.hello{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);animation:rise .6s .15s both}
.big-logo{font-family:var(--display);font-weight:700;font-size:clamp(64px,22vw,96px);line-height:.9;letter-spacing:-.04em;display:flex}
.big-logo span{display:inline-block;overflow:hidden;padding-bottom:.06em}
.big-logo span i{display:inline-block;font-style:normal;animation:letterUp .8s cubic-bezier(.2,.9,.2,1) both}
.big-logo .dot i{color:var(--lime-ink);animation:dotIn .7s cubic-bezier(.2,.9,.2,1) .75s both}
@keyframes letterUp{from{transform:translateY(105%) rotate(8deg)}}

const taste = i => Math.max(-3, Math.min(3, (S.taste && S.taste[i.name]) || 0));
function wpick(list){
  const alive = list.filter(i=>taste(i)>-2); const pool = alive.length ? alive : list;
  const ws = pool.map(i=>Math.exp(.7*taste(i)) * (i._w||1));
  let r = Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let k=0;k<pool.length;k++){ r-=ws[k]; if(r<=0) return pool[k]; }
  return pool[pool.length-1];
}
function pickIn(list, budget){
  let allowed = list.filter(i=>tierOf(i)<=budget);
  if(!allowed.length) allowed = [[...list].sort((a,b)=>a.price-b.price)[0]];
  return wpick(allowed.map(i=>({...i,_w: tierOf(i)===budget ? 2 : 1})));
}
const sumOf = items => items.reduce((a,i)=>a+i.price,0);
const rnd = arr => arr[Math.floor(Math.random()*arr.length)];
const keyOf = items => items.map(i=>i.name).sort().join('|');
const clean = i => { const c={...i}; delete c._w; return c; };
/* Une variante : les pièces verrouillées (fixed) sont gardées, le reste est tiré au sort */
function draft(st, pick, fixed){
  const fx = t => fixed.find(f=>f.type===t);
  const items = ['top','bottom','shoes'].map(t=> fx(t) || clean(pick(st.slots[t])));
  ['outer','acc'].forEach(t=>{ if(fx(t)) items.push(fx(t)); else if(st.slots[t] && Math.random()<(t==='outer'?.6:.5)) items.push(clean(pick(st.slots[t]))); });
  return items;
}
const trim = (items, cap, fixed) => { ['acc','outer'].forEach(t=>{ if(sumOf(items)>cap) items = items.filter(i=>i.type!==t || fixed.includes(i)); }); return items; };
/* Génère une variante de tenue pour un style et un budget, différente de la précédente si possible */
function buildLook(styleId, budget=S.budget, avoidKey=null, max=S.budgetMax, fixed=[]){
  const st = styleById(styleId);
  if(max) return buildUnder(st, max, avoidKey, fixed);
  let items, tries = 0;
  do{ items = trim(draft(st, l=>pickIn(l,budget), fixed), BUDGETS[budget].cap, fixed); tries++; }
  while(avoidKey && keyOf(items)===avoidKey && tries<14);
  return items;
}
/* Mode montant exact : on tire beaucoup de combinaisons et on garde celles sous le plafond */
function buildUnder(st, max, avoidKey, fixed=[]){
  const ok = [];
  for(let n=0;n<180;n++){
    const items = trim(draft(st, wpick, fixed), max, fixed);
    if(sumOf(items)<=max && keyOf(items)!==avoidKey) ok.push(items);
  }
  if(!ok.length){
    budgetTooLow = true;
    const fx = t => fixed.find(f=>f.type===t);
    return [...['top','bottom','shoes'].map(t=> fx(t) || {...[...st.slots[t]].sort((a,b)=>a.price-b.price)[0]}), ...fixed.filter(f=>f.type==='outer'||f.type==='acc')];
  }
  budgetTooLow = false;
  const good = ok.filter(x=>sumOf(x)>=max*.55);
  return rnd(good.length ? good : ok);
}

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return iso(d); };
const inDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const TODAY = iso(new Date());
const diffDays = (a,b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtDay = s => new Date(s+'T12:00').toLocaleDateString(LOC(),{day:'numeric',month:'short'});

const hex = ([r,g,b]) => '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const cdist = (a,b) => { const x=rgb(a),y=rgb(b); return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]); };
const shuffle = a => a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

  const M='var(--mannequin)', st='stroke="rgba(0,0,0,.16)" stroke-width="1.5" stroke-linejoin="round"';
  const topC = top ? top.color : (out ? '#D8D2E3' : '#ECE9F2');
  const armC = out ? out.color : topC;
  let s = `<svg viewBox="0 0 200 440" class="${cls}" role="img" aria-label="Tenue sur mannequin">`;
  s += `<ellipse cx="100" cy="410" rx="62" ry="7" fill="rgba(0,0,0,.18)"/>`;
  s += `<path d="M54 196H146L143 382H108L100 236 92 382H57Z" fill="${bot?bot.color:'#3B4A66'}" ${st}/>`;
  const shoe = `<path d="M56 380H97V394Q97 403 88 403H42Q36 403 38 395Q41 386 56 384Z" fill="${sh?sh.color:'#F2F2F2'}" ${st}/>`;
  s += shoe + `<g transform="translate(200 0) scale(-1 1)">${shoe}</g>`;
  s += `<rect x="92" y="70" width="16" height="20" fill="${M}"/>`;
  const arm = `<path d="M64 92 42 196 56 200 76 124Z" fill="${armC}" ${st}/>`;
  s += arm + `<g transform="translate(200 0) scale(-1 1)">${arm}</g>`;
  s += `<circle cx="47" cy="205" r="9" fill="${M}"/><circle cx="153" cy="205" r="9" fill="${M}"/>`;
  s += `<path d="M62 90Q100 80 138 90L148 206H52Z" fill="${topC}" ${st}/>`;
  s += `<path d="M88 84Q100 92 112 84" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="2"/>`;
  if(out){
    const panel = `<path d="M62 90Q78 84 90 86L93 214H48Z" fill="${out.color}" ${st}/>`;
    s += panel + `<g transform="translate(200 0) scale(-1 1)">${panel}</g>`;
  }
  s += `<circle cx="100" cy="50" r="25" fill="${M}"/>`;
  if(acc){
    if(acc.shape==='bag') s += `<path d="M78 92 146 186" stroke="${acc.color}" stroke-width="4"/><rect x="130" y="180" width="36" height="28" rx="7" fill="${acc.color}" ${st}/>`;

  }
  return s + `</svg>`;
}
function pinPos(item, items){
  const hasOut = items.some(i=>i.type==='outer');
  switch(item.type){
    case 'acc': return item.shape==='bag' ? [74,44] : [50,7];
    case 'outer': return [28,32];
    case 'top': return hasOut ? [50,29] : [50,33];
    case 'bottom': return [50,64];
    case 'shoes': return [30,90];
  }
  return [50,50];
}

function dayOutfit(){
  const occ = OCCASIONS.find(o=>o.id===S.occasion), w = S.weather, seed = S.daySeed;
  const needOuter = w==='pluie'||w==='froid', noOuter = w==='soleil';
  const order = occ.styles.map((_,k)=>occ.styles[(k+seed)%occ.styles.length]);
  const forced = S.forceItem ? S.wardrobe.find(i=>i.id===S.forceItem) : null;
  const byIdle = (arr) => [...arr].sort((a,b)=>idleDays(b.id)-idleDays(a.id));
  for(const sid of order){
    const pool = S.wardrobe.filter(i=>(i.tags||[]).includes(sid));
    const pick = t => { if(forced && forced.type===t) return forced; const c=byIdle(pool.filter(i=>i.type===t)); return c[Math.min(seed%2,c.length-1)] || c[0]; };
    const top=pick('top'), bot=pick('bottom'), sh=pick('shoes');
    if(!(top&&bot&&sh)) continue;
    const items=[top,bot,sh]; const reasons=[];
    let out = forced && forced.type==='outer' ? forced : null;
    if(!out && needOuter) out = pick('outer') || byIdle(S.wardrobe.filter(i=>i.type==='outer'))[0];
    else if(!out && !noOuter && seed%2===0) out = pick('outer');
    if(out && !noOuter) items.push(out);
    if(forced && forced.type==='acc') items.push(forced); else if(w!=='pluie' && seed%3===1){ const a=pick('acc'); if(a) items.push(a); }
    reasons.push(WEATHER[w].rule);
    const ev = AGENDA.find(a=>a.occasion===S.occasion);
    reasons.push(ev ? `${ev.title} à ${ev.time} : style ${styleById(sid).name}.` : `Occasion ${occ.label} : style ${styleById(sid).name}.`);
    items.forEach(i=>{ const d=idleDays(i.id); if(d===Infinity) reasons.push(`${i.name} : jamais portée, c'est le moment.`); else if(d>=14) reasons.push(`${i.name} ressort après ${d} jours.`); });
    return {label:styleById(sid).name, styleId:sid, items, reasons};
  }
  // Rien de complet : on complète avec des articles à acheter
  const st = styleById(order[0]);
  const items = buildLook(st.id).filter(i=>i.type!=='acc').map(tpl => S.wardrobe.find(i=>i.type===tpl.type && (i.tags||[]).includes(st.id)) || {...tpl});
  return {label:st.name, styleId:st.id, items, reasons:[WEATHER[w].rule,'Il te manque des pièces pour ce style : les articles à acheter sont liés.']};
}

const FILTERS = [['all','Tout'],['top','Hauts'],['outer','Vestes'],['bottom','Bas'],['shoes','Chaussures'],['acc','Accessoires'],['sleep','À ressortir']];
function comboCount(ward){
  let n=0; STYLES.forEach(st=>{ const f=t=>ward.filter(i=>i.type===t&&(i.tags||[]).includes(st.id)).length; n+=f('top')*f('bottom')*f('shoes')*(1+f('outer')); }); return n;
}
function impactList(){
  const base = comboCount(S.wardrobe);
  const cands = [...BASICS, ...allCatalog().filter(i=>i.type!=='acc')].filter(fitsBudget)
    .filter(c=>!S.wardrobe.some(w=>w.type===c.type && cdist(w.color,c.color)<40));
  return cands.map(c=>({item:c, gain: comboCount([...S.wardrobe,{...c,owned:true}]) - base}))
    .filter(x=>x.gain>0).sort((a,b)=>b.gain-a.gain || a.item.price-b.item.price).slice(0,4);
}

function makeOutfits(){
  const res = [];
  shuffle(STYLES).forEach(st => {
    const pool = S.wardrobe.filter(i=>(i.tags||[]).includes(st.id));
    const pick = t => shuffle(pool.filter(i=>i.type===t))[0];
    const top=pick('top'), bot=pick('bottom'), sh=pick('shoes');
    if(!(top && bot && sh)) return;
    const items=[top,bot,sh]; const out=pick('outer'), acc=pick('acc');
    if(out && Math.random()>.3) items.push(out); if(acc && Math.random()>.4) items.push(acc);
    res.push({label:st.name, styleId:st.id, items});
  });
  return res.slice(0,4);
}

function similarPairs(f){
  const pairs=[];
  S.wardrobe.forEach(m=>f.items.forEach(t=>{ if(m.type===t.type && cdist(m.color,t.color)<60) pairs.push([m,t]); }));
  return pairs;

function matchOutfit(f){
  let best=null;
  STYLES.forEach(st=>{
    const mine=S.wardrobe.filter(i=>(i.tags||[]).includes(st.id)), theirs=f.items.filter(i=>(i.tags||[]).includes(st.id));
    if(!theirs.length) return;
    const items=[]; let fromThem=0;
    const fav = shuffle(theirs.filter(t=>['bottom','outer','acc','top'].includes(t.type)))[0];
    ['top','bottom','shoes','outer','acc'].forEach(s=>{
      if(fav && fav.type===s){ items.push({...fav,friend:f.name,fid:f.id}); fromThem++; return; }
      const m = mine.find(i=>i.type===s); if(m){ items.push(m); return; }
      const t = theirs.find(i=>i.type===s); if(t && ['top','bottom','shoes'].includes(s)){ items.push({...t,friend:f.name,fid:f.id}); fromThem++; }
    });
    const ok = ['top','bottom','shoes'].every(t=>items.some(i=>i.type===t));
    if(ok && fromThem && items.length-fromThem){ const score = items.length + Math.random(); if(!best||score>best.score) best={score,styleId:st.id,label:st.name,items}; }
  });
  return best;
}

    <div class="eyebrow">Le thème</div>

    <button class="btn primary" data-action="g-go">${I.mix}Habiller le groupe</button>`;
  if(g.result){
    const buy = g.result.reduce((a,p)=>a+p.buy,0);
    h += `<div class="group-grid">${g.result.map(p=>`<div class="gcard">${avatar(sortItems(p.items))}<b>${esc(p.name)}</b><span>${p.buy?`${p.buy} à acheter`:'Tout en stock'}</span></div>`).join('')}</div>
      <p class="hint">${buy?`${buy} pièce${buy>1?'s':''} manquante${buy>1?'s':''} au total, avec liens dans le look de chacun.`:'Tout le monde a déjà ce qu\'il faut.'} Pour les amis en mode matching, seules les pièces utilisées sont montrées.</p>
      <button class="btn mauve" data-action="g-try">Voir ma tenue en détail</button>`;
  }
  return h;

function dressPerson(name, wardrobe, st, isMe){
  const items=[]; let buy=0;
  buildLook(st.id).forEach(tpl=>{
    const m = wardrobe.find(i=>i.type===tpl.type && (i.tags||[]).includes(st.id));
    if(m) items.push(isMe?m:{...m,friend:name});
    else if(tpl.type!=='acc' && tpl.type!=='outer'){ items.push({...tpl}); buy++; }
  });
  return {name, items, buy};
}

function trStr(k){
  if(!S.lang || S.lang==='fr') return k;
  const d = DICT[S.lang];
  if(d[k] != null) return d[k];
  const n = NAMES[S.lang][k]; if(n) return n;
  for(const [re,f] of RULES){ const m = k.match(re); if(m) return f(m); }
  if(k.includes(' · ')) return k.split(' · ').map(trStr).join(' · ');
  return k;
}
function tr(s){
  if(!S.lang || S.lang==='fr' || !s) return s;
  const k = s.trim(); if(!k) return s;
  const t = trStr(k); return t===k ? s : s.replace(k, t);
}
function translateDOM(root){
  if(!root || !S.lang || S.lang==='fr') return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const nodes=[];
  while(n = w.nextNode()){ if(/[A-Za-zÀ-ÿ]/.test(n.nodeValue)) nodes.push(n); }
  nodes.forEach(n => { const v = tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue = v; });
  [root, ...root.querySelectorAll('[aria-label],[placeholder],[title]')].forEach(e => ['aria-label','placeholder','title'].forEach(a => { const v=e.getAttribute(a); if(v){ const t=tr(v); if(t!==v) e.setAttribute(a,t); } }));
}

function generate(){
  if(S.generating) return;
  S.generating = true; S.pending = false; render();
  const steps = ['Analyse de la silhouette…','Application du style '+styleById(S.style).name+'…','Recherche des articles…'];
  steps.forEach((t,k)=>setTimeout(()=>{ const el=document.getElementById('loadTxt'); if(el) el.textContent=tr(t); }, k*550));
  setTimeout(()=>{
    const st = styleById(S.style);
    S.variant = (S.look && S.look.styleId===st.id) ? (S.variant||1)+1 : 1;
    S.look = {label:st.name, styleId:st.id, items: makeVariant(st.id, S.look && S.look.styleId===st.id ? lookKey(S.look) : null)};
    S.generating = false; S.fresh = true; S.cut = 25; render();
    document.getElementById('stage')?.scrollIntoView({behavior:'smooth',block:'start'});
  }, 1700);

function saveLook(look){

  save();
}

function createPoll(a, q){

  if(!b){ const other = shuffle(STYLES.filter(s=>s.id!==a.styleId))[0]; b = {label:other.name, styleId:other.id, items:buildLook(other.id)}; }
  S.polls.unshift({id:'p'+Date.now(), q, a:{label:a.label,styleId:a.styleId,items:a.items.map(i=>({...i}))}, b:{label:b.label,styleId:b.styleId,items:b.items.map(i=>({...i}))}, va:0, vb:0, open:true, target:Math.max(2,S.friends.filter(f=>!f.pending).length+1)});

function findLookItem(id){
  const pools = [S.look?.items||[], S.friendResult?.data?.items||[]];
  for(const p of pools){ const k = sortItems(p).findIndex(x=>x.id===id); if(k>=0) return [sortItems(p)[k], k+1]; }
  return [null,0];
}

/* Comparateur avant / après : glisser le doigt ou toucher les boutons */
function setCut(v, animate){
  S.cut = Math.max(0, Math.min(100, v));
  const st = document.getElementById('stage'); if(!st) return;
  if(animate){ st.classList.add('anim'); setTimeout(()=>st.classList.remove('anim'), 380); }
  st.style.setProperty('--cut', S.cut+'%');
  const L=document.getElementById('tagL'), R=document.getElementById('tagR');
  if(L) L.style.opacity = S.cut>14 ? 1 : 0;
  if(R) R.style.opacity = S.cut<86 ? 1 : 0;
  const cl = st.querySelector('.cutline'); if(cl) cl.style.opacity = (S.cut<=2 || S.cut>=98) ? 0 : 1;
  const mode = S.cut>=95 ? 'B' : S.cut<=5 ? 'A' : 'C';
  ['B','C','A'].forEach(k=>{ const b=document.getElementById('cmp'+k); if(b) b.setAttribute('aria-pressed', k===mode); });
}

let drag = null;
document.addEventListener('pointerdown', e => {

  const r = st.getBoundingClientRect(), cx = r.left + r.width*S.cut/100;
  drag = { st, x0:e.clientX, y0:e.clientY, mode: Math.abs(e.clientX-cx) < 34 ? 'cut' : 'maybe', id:e.pointerId };
  if(drag.mode==='cut') st.setPointerCapture?.(e.pointerId);
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX-drag.x0, dy = e.clientY-drag.y0, st = drag.st;
  if(drag.mode==='cut'){ const r=st.getBoundingClientRect(); setCut((e.clientX-r.left)/r.width*100); return; }
  if(drag.mode==='maybe'){
    if(Math.abs(dy)>12 && Math.abs(dy)>Math.abs(dx)){ drag=null; return; }
    if(Math.abs(dx)>10){ drag.mode='swipe'; st.setPointerCapture?.(drag.id); st.classList.add('dragging'); }
    else return;
  }
  st.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
  const p = Math.min(1, Math.abs(dx)/90);
  document.getElementById('stampL').style.opacity = dx>0 ? p : 0;
  document.getElementById('stampN').style.opacity = dx<0 ? p : 0;
});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev, e => {
  if(!drag) return; const d = drag; drag = null;
  if(d.mode!=='swipe') return;
  const dx = e.clientX - d.x0; d.st.classList.remove('dragging');
  if(ev==='pointerup' && Math.abs(dx)>90) flyOut(dx>0?1:-1);
  else { d.st.style.transform=''; ['stampL','stampN'].forEach(k=>{ const el=document.getElementById(k); if(el) el.style.opacity=0; }); }
}));
function flyOut(dir){
  const st = document.getElementById('stage'); if(!st || !S.look || S.generating) return;
  if(S.pending){ generate(); return; }
  document.getElementById(dir>0?'stampL':'stampN').style.opacity = 1;
  st.classList.add('flying'); st.style.transform = `translateX(${dir*130}%) rotate(${dir*16}deg)`; st.style.opacity = 0;
  setTimeout(()=>swipeDecision(dir), 260);
}
function swipeDecision(dir){
  const look = S.look;
  look.items.forEach(i=>{ if(!isLocked(i)) S.taste[i.name] = Math.max(-3, Math.min(3, (S.taste[i.name]||0) + (dir>0?1:-1))); });
  S.tasteN++;
  if(dir>0 && !isSaved(look)){ S.saved.unshift({key:lookKey(look),label:look.label,styleId:look.styleId,items:look.items.map(i=>({...i}))}); }
  S.variant = (S.variant||1)+1;
  S.look = {label:look.label, styleId:look.styleId, items: makeVariant(look.styleId, lookKey(look))};
  S.fresh = true; S.enterDir = dir; S.cut = 25; save(); render();
  toast(dir>0 ? 'Aimé et enregistré, je t\'en propose plus comme ça' : 'Noté, voici une autre variante');
}

/* ================= Analyse d'image (détourage + couleur + catégorie) ================= */
function analyze(dataUrl){
  return new Promise(res=>{
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 420/Math.max(img.width,img.height));
      const w = Math.max(1,Math.round(img.width*k)), h = Math.max(1,Math.round(img.height*k));
      const c = document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const orig = c.toDataURL('image/jpeg',.85);
      let data; try{ data = ctx.getImageData(0,0,w,h); }catch(e){ return res({orig,cut:orig,color:'#8E8A96',type:'top'}); }
      const px = data.data, at = (x,y)=>(y*w+x)*4;
      const corners=[]; const s=Math.max(2,Math.round(Math.min(w,h)*.04));
      [[0,0],[w-s,0],[0,h-s],[w-s,h-s]].forEach(([x0,y0])=>{ for(let y=y0;y<y0+s;y++)for(let x=x0;x<x0+s;x++){ const p=at(x,y); corners.push([px[p],px[p+1],px[p+2]]); } });
      const bg = [0,1,2].map(j=>corners.reduce((a,v)=>a+v[j],0)/corners.length);
      let n=0,sr=0,sg=0,sb=0,minX=w,minY=h,maxX=0,maxY=0;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const p=at(x,y); const d=Math.hypot(px[p]-bg[0],px[p+1]-bg[1],px[p+2]-bg[2]);
        if(d<46){ px[p+3]=d<30?0:Math.round((d-30)/16*255); } else { n++; sr+=px[p]; sg+=px[p+1]; sb+=px[p+2]; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
      const frac = n/(w*h);
      let cut = orig;
      if(frac>.05 && frac<.95){ ctx.putImageData(data,0,0); cut = c.toDataURL('image/png'); }
      const avg = n ? hex([sr/n,sg/n,sb/n]) : '#8E8A96';
      const color = COLORS.reduce((best,col)=>cdist(col,avg)<cdist(best,avg)?col:best, COLORS[0]);
      const bw = Math.max(1,maxX-minX), bh = Math.max(1,maxY-minY), ratio = bh/bw;
      const type = ratio>1.45 ? 'bottom' : ratio<.72 ? 'shoes' : 'top';
      res({orig, cut, color, type});
    };
    img.onerror = () => res({orig:dataUrl,cut:dataUrl,color:'#8E8A96',type:'top'});
    img.src = dataUrl;
  });
}
function guessStyle(type,color){
  let best=null, bd=1e9;
  allCatalog().forEach(i=>{ if(i.type!==type) return; const d=cdist(i.color,color); if(d<bd){bd=d;best=i.tags[0];} });
  return best || 'minimal';
}
function readFile(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function shrink(dataUrl, max){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; img.onerror=()=>res(dataUrl); img.src=dataUrl; });
}
function squareCrop(dataUrl, size){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const m=Math.min(img.width,img.height); const c=document.createElement('canvas'); c.width=c.height=size;
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size); res(c.toDataURL('image/jpeg',.85)); }; img.onerror=()=>res(dataUrl); img.src=dataUrl; });
}
function nextDraft(){
  const a = S.queue.shift();
  if(!a){ closeSheet(); return; }
  S.draft = {orig:a.orig,cut:a.cut,cutOn:a.cut!==a.orig,name:'',type:a.type,autoType:a.type,color:a.color,autoColor:a.color,tags:[guessStyle(a.type,a.color)]};
  openSheet(addSheet());
}

/* Votes simulés des amis sur les sondages ouverts */
setInterval(()=>{
  let changed=false;
  S.polls.forEach(p=>{ if(p.open && p.va+p.vb<p.target && Math.random()<.5){ Math.random()<.55?p.va++:p.vb++; changed=true; if(p.va+p.vb>=p.target) p.open=false; } });
  if(!changed) return;
  save();
  S.polls.forEach(p=>{ const r=document.getElementById('pollrow-'+p.id); if(r){ r.innerHTML = `${p.va+p.vb}/${p.target} votes · ${pollLead(p)}`; translateDOM(r); } });
  if(S.openPoll && !document.getElementById('sheetWrap').hidden){ const p=S.polls.find(x=>x.id===S.openPoll); const el=document.getElementById('poll-'+(p&&p.id)); if(p && el){ el.outerHTML = pollHTML(p); translateDOM(document.getElementById('sheetBody')); } }
}, 2600);


/* ================= Écran d'accueil ================= */
function renderIntro(){
  const el = document.getElementById('intro'); if(!el) return;
  const h = new Date().getHours(), hello = h<6 ? 'Bonne nuit' : h<12 ? 'Bonjour' : h<18 ? 'Bon après-midi' : 'Bonsoir';
  const looks = [{l:'Streetwear',i:buildLook('streetwear',2,null,null)},{l:'Old Money',i:buildLook('oldmoney',2,null,null)},{l:'Y2K',i:buildLook('y2k',2,null,null)},{l:'Soirée',i:buildLook('soiree',2,null,null)}];
  const w = WEATHER[S.weather], ev = AGENDA.find(a=>a.occasion===S.occasion) || AGENDA[0];
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  el.innerHTML = `<div class="blob a"></div><div class="blob b"></div>
    <button class="icon-btn intro-theme" id="introTheme" data-action="theme" aria-label="Changer de thème">${S.theme==='dark'?I.sun:I.moon}</button>
    <div class="intro-in">
      <div class="intro-top">
        <div class="hello">${hello}</div>
        <div class="big-logo" aria-label="Tenu">${['T','e','n','u'].map((c,k)=>`<span><i style="animation-delay:${.35+k*.08}s">${c}</i></span>`).join('')}<span class="dot"><i>.</i></span></div>
        <p class="tagline">Ton dressing, ton style, tes tenues. En un geste.</p>
      </div>
      <div class="intro-stage" aria-hidden="true">${looks.map(x=>avatar(sortItems(x.i))).join('')}<div class="intro-label">${looks.map(x=>`<b>${x.l}</b>`).join('')}</div></div>
      <div class="intro-bottom">
        <div class="today-chips">
          <span>${I.today}${new Date().toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'})}</span>
          <span>${I[WX_ICON[S.weather]]}${w.t}° · ${w.label}</span>
          <span>${I.dressing}${ev.time} · ${esc(ev.title)}</span>
        </div>
        <button class="start" data-action="start" data-v="today"><span class="t"><b>Démarrer</b><small>Voir ma tenue du jour</small></span><span class="arr">${arrow}</span></button>
        <button class="skip" data-action="start" data-v="cabine">Essayer un style directement</button>
      </div>
    </div>`;
  translateDOM(el);
  document.documentElement.classList.add('intro-open');
}
function leaveIntro(tab){
  const el = document.getElementById('intro'); if(!el || el.classList.contains('leaving')) return;
  el.classList.add('leaving');
  document.documentElement.classList.remove('intro-open');
  S.tab = tab; render({launch:true}); window.scrollTo({top:0});
  setTimeout(()=>el.remove(), 800);
}
/* Sauvegarde immédiate quand l'app passe en arrière-plan */
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);
/* Mode léger pour les téléphones modestes : moins d'effets simultanés */
(function(){
  const mem = navigator.deviceMemory || 8, cores = navigator.hardwareConcurrency || 8;
  if(mem <= 4 || cores <= 4) document.documentElement.classList.add('lite');
})();
/* ================= Démarrage ================= */
load();
S.variant = 1;
S.look = {label:'Streetwear', styleId:'streetwear', items: buildLook('streetwear')};
S.outfits = makeOutfits();
render();
renderIntro();
if(document.getElementById('intro')) document.getElementById('main').classList.add('pre');
</script>

</body>
</html>
